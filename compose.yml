services:
  app:
    image: node:24-alpine
    container_name: node-ci-cd-pipeline
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env
    ports:
      - ${APP_PORT}:${APP_PORT}
    volumes:
      - .:/app
    networks:
      - node-ci-cd-pipeline-network

networks:
  node-ci-cd-pipeline-network:
    driver: bridge